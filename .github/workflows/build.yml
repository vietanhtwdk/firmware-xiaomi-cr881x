name: build firmware

# Builds the CR881x RA82-international mod and publishes it as a GitHub release.
# Both inputs are pulled from Xiaomi's official CDN, so no device dump or secret
# is needed: the downloaded CR8818 6.20.58 rootfs is byte-identical to a real
# mtd18 dump, and build.sh unwraps its HDR1 header automatically.
#
# A fresh random root password is generated each run and written into the
# release notes (SSH + web). It is PUBLIC on a public repo — change it on first
# login with `passwd`.

on:
  workflow_dispatch:
    inputs:
      country:
        description: nvram CountryCode set on boot (blank = leave as shipped)
        default: VN
      features:
        description: FEATURES passed to build.sh
        default: adblock wol zerotier dropbear
      cr8818:
        description: CR8818 hardware-layer firmware (kernel + drivers) version
        type: choice
        default: '6.20.58'
        options:
          - '6.20.58'
          - '6.21.96'
      cr8818_url:
        description: 'override: full CR8818 firmware URL (blank = use the version above)'
        default: ''
      ra82_url:
        description: RA82 international userspace firmware URL
        default: https://cdn.awsde0-fusion.fds.api.mi-img.com/xiaoqiang/rom/ra82/miwifi_ra82_firmware_db06e_1.4.31_INT.bin
  push:
    tags: ['v*', 'fw-*']

permissions:
  contents: write        # create the release

env:
  COUNTRY: ${{ inputs.country || 'VN' }}
  FEATURES: ${{ inputs.features || 'adblock wol zerotier dropbear' }}
  RA82_URL_DEFAULT: https://cdn.awsde0-fusion.fds.api.mi-img.com/xiaoqiang/rom/ra82/miwifi_ra82_firmware_db06e_1.4.31_INT.bin
  CR8818_URL_62058: http://cdn.cnbj1.fds.api.mi-img.com/xiaoqiang/rom/cr8818/miwifi_cr8818_firmware_4f56a_6.20.58.bin
  CR8818_URL_62196: https://cdn.cnbj1.fds.api.mi-img.com/xiaoqiang/rom/cr8818/miwifi_cr8818_firmware_f158d_6.21.96.bin
  ZT_VERSION: 1.14.2
  DB_VERSION: 2026.94

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            squashfs-tools mtd-utils fakeroot openssl patch curl git make \
            gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf

      - name: Download firmware (RA82 userspace + chosen CR8818 hardware layer)
        env:
          IN_RA82_URL: ${{ inputs.ra82_url }}
          IN_CR8818: ${{ inputs.cr8818 }}
          IN_CR8818_URL: ${{ inputs.cr8818_url }}
        run: |
          RA82_URL=${IN_RA82_URL:-$RA82_URL_DEFAULT}
          if [ -n "$IN_CR8818_URL" ]; then
            CR8818_URL=$IN_CR8818_URL; CR_VER=custom
          elif [ "$IN_CR8818" = 6.21.96 ]; then
            CR8818_URL=$CR8818_URL_62196; CR_VER=6.21.96
          else
            CR8818_URL=$CR8818_URL_62058; CR_VER=6.20.58
          fi
          echo "CR_VER=$CR_VER" >> "$GITHUB_ENV"   # for the release notes
          echo "==> CR8818 hardware layer: $CR_VER"
          echo "==> $CR8818_URL"
          mkdir -p dl
          curl -fL --retry 5 --retry-all-errors -o dl/ra82.bin   "$RA82_URL"
          curl -fL --retry 5 --retry-all-errors -o dl/cr8818.bin "$CR8818_URL"
          sha256sum dl/ra82.bin dl/cr8818.bin
          # both must be complete HDR1 images (~25.9 MB), not a truncated download
          for f in dl/ra82.bin dl/cr8818.bin; do
            [ "$(head -c4 "$f")" = HDR1 ] || { echo "$f is not an HDR1 image" >&2; exit 1; }
            [ "$(stat -c%s "$f")" -ge 25000000 ] || { echo "$f looks truncated" >&2; exit 1; }
          done

      - name: Cache static ARM binaries (zerotier, dropbear)
        id: armbin
        uses: actions/cache@v4
        with:
          path: bin
          key: armbin-zt${{ env.ZT_VERSION }}-db${{ env.DB_VERSION }}-${{ hashFiles('tools/build-zerotier.sh', 'tools/build-dropbear.sh', 'files/dropbear-allow-blank-root-password.patch') }}

      - name: Build zerotier-one (static ARMv7)
        if: steps.armbin.outputs.cache-hit != 'true'
        run: tools/build-zerotier.sh "$ZT_VERSION" bin

      - name: Build dropbear (static ARMv7)
        if: steps.armbin.outputs.cache-hit != 'true'
        run: tools/build-dropbear.sh "$DB_VERSION" bin

      - name: Generate default root password
        id: pw
        run: |
          PW=$(openssl rand -base64 18 | tr -dc 'A-Za-z0-9')
          PW=${PW:0:16}
          echo "::add-mask::$PW"
          echo "password=$PW" >> "$GITHUB_OUTPUT"

      - name: Build firmware
        env:
          ROOT_PASSWORD: ${{ steps.pw.outputs.password }}
          ZEROTIER_BIN: bin/zerotier-one
          DROPBEAR_BIN: bin/dropbear
        run: ./build.sh dl/ra82.bin dl/cr8818.bin out

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          PW: ${{ steps.pw.outputs.password }}
        run: |
          IMG=$(ls out/*.ubi)
          NAME=$(basename "$IMG" .ubi)
          ROMVER=$(echo "$NAME" | sed -n 's/^cr881x-ra82-\(.*\)-mod$/\1/p')
          [ -n "$ROMVER" ] || ROMVER=$NAME
          BUILD="$(date +%Y%m%d).${GITHUB_RUN_NUMBER}"      # build version: date.run
          SHORT=${GITHUB_SHA::7}
          # versioned asset + tag so each build is a distinct file and release
          ASSET="cr881x-ra82-${ROMVER}-mod-${BUILD}.ubi"
          cp "$IMG" "$ASSET"
          sha256sum "$ASSET" > "$ASSET.sha256"
          SUM=$(cut -d' ' -f1 "$ASSET.sha256")
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="fw-${ROMVER}-${BUILD}-${SHORT}"
          fi
          TITLE="CR881x RA82 ${ROMVER} · CR8818 ${CR_VER} — build ${BUILD}"
          cat > notes.md <<EOF
          Xiaomi CR881x — RA82 international mod

          ## ⚠️ Mật khẩu mặc định (SSH \`root@\` và đăng nhập web)

          \`\`\`
          $PW
          \`\`\`

          Đổi **ngay** sau lần đăng nhập đầu: \`passwd\`. Mật khẩu này sinh ngẫu
          nhiên mỗi lần build và **công khai** trong release — coi như dùng tạm.

          ## Image

          | | |
          |---|---|
          | File | \`$ASSET\` |
          | sha256 | \`$SUM\` |
          | Build | \`$BUILD\` · commit \`$SHORT\` |
          | Features | \`$FEATURES\` |
          | CountryCode | \`${COUNTRY:-(giữ nguyên)}\` |
          | Userspace | RA82 INT 1.4.31 (CDN chính thức) |
          | Hardware layer | CR8818 ${CR_VER} |

          ## Nạp (đang có SSH vào router — stock hoặc OpenWrt)

          CR881x có 2 slot: \`rootfs\` (mtd18) và \`rootfs_1\` (mtd19); chỉ ghi được
          slot đang **không** chạy. Chép image lên rồi so sha256:

          \`\`\`sh
          scp -O $ASSET root@192.168.31.1:/tmp/fw.ubi
          # trên router: phải khớp bảng trên
          sha256sum /tmp/fw.ubi
          \`\`\`

          Ghi vào mtd19 và cho boot slot đó (giữ ROM ở mtd18 làm cứu hộ):

          \`\`\`sh
          ubiformat /dev/mtd19 -y -f /tmp/fw.ubi
          nvram set flag_try_sys2_failed=0
          nvram set flag_boot_rootfs=1
          nvram set flag_last_success=1
          nvram set flag_format_overlay=1   # bắt buộc khi nạp từ ROM gốc / firmware khác
          nvram commit
          reboot
          \`\`\`

          Quay lại mtd18 nếu cần:

          \`\`\`sh
          nvram set flag_try_sys1_failed=0
          nvram set flag_try_sys2_failed=0
          nvram set flag_boot_rootfs=0
          nvram set flag_last_success=0
          nvram set flag_format_overlay=1
          nvram commit
          reboot
          \`\`\`

          ✅ **Có rollback tự động**: U-Boot đánh dấu "đang thử" slot trước khi
          boot, chỉ khi boot tới cùng mới xoá (boot_check). Slot mới hỏng →
          bật/tắt nguồn, U-Boot tự về slot cũ. Giữ ROM ở mtd18 là lưới an toàn;
          UART chỉ cần khi **cả hai** slot hỏng.
          \`flag_format_overlay=1\` để firmware chép cấu hình/mật khẩu vào \`/data\`;
          chỉ bỏ khi cập nhật từ chính bản build này. Chi tiết: README.
          EOF
          # GitHub's releases API returns transient 5xx; create the release
          # (retrying, and treating "already exists" from a half-done attempt as
          # success), then upload the assets idempotently with --clobber.
          for i in 1 2 3; do
            gh release view "$TAG" >/dev/null 2>&1 && break
            gh release create "$TAG" --title "$TITLE" --notes-file notes.md && break
            echo "release create failed (attempt $i), retrying..." >&2; sleep 5
          done
          gh release view "$TAG" >/dev/null 2>&1 || { echo "could not create release $TAG" >&2; exit 1; }
          gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cr881x-firmware
          path: |
            out/*.ubi
            out/*.ubi.sha256
